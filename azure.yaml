name: azd-rails-starter
services:
  azure-rails-starter:
    language: js
    project: ./src
    host: containerapp
    docker:
      path: ./Dockerfile
      ports:
      - 80:3000
hooks:
  postprovision:
    windows:
      shell: pwsh
      run: $output = azd env get-values; Add-Content -Path .env -Value $output;
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: azd env get-values > .env
      interactive: true
      continueOnError: false
metadata:
  template: azure-rails-starter@0.0.1-beta
